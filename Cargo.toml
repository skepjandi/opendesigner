[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/store", "crates/agent", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/skepjandi/opendesigner"
authors = ["OpenDesigner contributors"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
clap = { version = "4", features = ["derive"] }
tiny-skia = "0.12"
png = "0.18"
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time", "signal"] }
base64 = "0.23"
getrandom = "0.4"
sha2 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
