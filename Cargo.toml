[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/media", "crates/store", "crates/agent", "crates/cli", "crates/app"]
default-members = ["crates/core", "crates/render", "crates/media", "crates/store", "crates/agent", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/skepjandi/opendesigner"
authors = ["OpenDesigner contributors"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
clap = { version = "4", features = ["derive"] }
tiny-skia = "0.12"
png = "0.18"
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time", "signal", "process"] }
base64 = "0.23"
getrandom = "0.4"
sha2 = "0.11"
# TLS for the Freesound client: rustls does the handshake, rustls-native-certs reads the root
# certificates the operating system trusts. Both are permissive and audited by `cargo deny`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
# SVG to PNG at import (icons, blobs, backgrounds). Same tiny-skia family as the renderer; text and
# raster-image support are off: an asset SVG is paths, and nothing it names is ever fetched.
resvg = { version = "0.50", default-features = false }
flate2 = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

# Rendering and encoding video is pixel work: a debug build of it is 30 times slower, which made
# a short export take minutes. Dependencies and the rendering crates are optimized even in
# development builds (the editor's own code still builds fast and debuggable).
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.opendesigner-render]
opt-level = 3

[profile.dev.package.opendesigner-media]
opt-level = 3

[profile.dev.package.opendesigner-core]
opt-level = 2
