<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ad0ff"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe2c4"/>
      <stop offset="1" stop-color="#f0a97c"/>
    </radialGradient>
    <linearGradient id="shirt" gradientUnits="userSpaceOnUse" x1="60" y1="170" x2="140" y2="250">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
  </defs>
  <rect id="background" width="200" height="300" fill="url(#sky)"/>
  <ellipse id="shadow" cx="100" cy="275" rx="55" ry="10" fill="#000000" fill-opacity="0.2"/>
  <g id="body">
    <rect id="torso" x="60" y="170" width="80" height="90" rx="22" fill="url(#shirt)"/>
    <g id="arm-left" transform="rotate(-25 66 180)">
      <rect id="sleeve-left" x="40" y="178" width="30" height="70" rx="15" fill="#f0a97c"/>
    </g>
    <g id="arm-right" transform="translate(10 0) rotate(25 134 180)">
      <rect id="sleeve-right" x="130" y="178" width="30" height="70" rx="15" fill="#f0a97c"/>
    </g>
  </g>
  <g id="head">
    <circle id="face" cx="100" cy="120" r="48" fill="url(#skin)"/>
    <ellipse id="eye-left" cx="82" cy="115" rx="6" ry="8" fill="#222222"/>
    <ellipse id="eye-right" cx="118" cy="115" rx="6" ry="8" fill="#222222"/>
    <path id="mouth" d="M80 140 Q100 158 120 140" fill="none" stroke="#a03030" stroke-width="5" stroke-linecap="round"/>
    <path id="hat" fill-rule="evenodd" d="M55 85 H145 V70 H55 Z M70 80 H130 V74 H70 Z" fill="#334455"/>
  </g>
</svg>
