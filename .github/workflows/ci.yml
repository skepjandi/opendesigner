name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no Qt: the default workspace members (core, render, store, agent, cli).
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The Qt Quick editor. macOS has been run by hand. The Linux and Windows jobs below are the first
  # automated runs of the editor on those systems: until a run of them is green they are unverified
  # (each is a separate job, so a failure in one does not hide the others).
  app-macos:
    name: Editor (macOS, Qt 6)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - run: brew install qt
      - name: Lint and test the editor
        run: |
          export QMAKE="$(brew --prefix qt)/bin/qmake"
          cargo clippy -p opendesigner-app --all-targets --locked -- -D warnings
          cargo test -p opendesigner-app --locked

  # Qt 6 from the distribution (Ubuntu 24.04 ships 6.4) with the same package set as
  # packaging/linux/Dockerfile, which scripts/test-linux.sh builds and tests in. The window is
  # drawn offscreen with the software renderer, so no display or GPU is needed.
  app-linux:
    name: Editor (Linux, Qt 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QMAKE: /usr/lib/qt6/bin/qmake6
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config lld \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtqml qml6-module-qtqml-workerscript qml6-module-qt-labs-folderlistmodel \
            qml6-module-qt-labs-platform qml6-module-qtcore \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1 fonts-dejavu-core
      - name: Lint and test the editor
        run: |
          cargo clippy -p opendesigner-app --all-targets --locked -- -D warnings
          cargo test -p opendesigner-app --locked

  # Qt 6.8 (the current LTS line) from the official installers through install-qt-action, which
  # puts Qt's bin on PATH and sets QT_ROOT_DIR and QML2_IMPORT_PATH. The build links only the
  # modules in crates/app/build.rs (Qt Network, plus what cxx-qt-lib's qt_full needs from qtbase
  # and qtdeclarative), all LGPL.
  app-windows:
    name: Editor (Windows, Qt 6)
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Lint and test the editor
        shell: bash
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake.exe"
          cargo clippy -p opendesigner-app --all-targets --locked -- -D warnings
          cargo test -p opendesigner-app --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
