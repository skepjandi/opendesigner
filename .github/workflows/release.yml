name: Release

# Pushing a tag `vX.Y.Z` builds the editor for macOS, Windows and Linux and publishes a GitHub
# release with the three downloads and their checksums. The tag must match `version` in
# Cargo.toml. A pull request that changes the packaging runs the same builds without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-*.sh
      - scripts/bundle-*.sh
      - packaging/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple silicon)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: brew install qt
      - name: Package
        run: |
          export QMAKE="$(brew --prefix qt)/bin/qmake"
          scripts/package-macos.sh dist
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          ditto -c -k --keepParent dist/OpenDesigner.app "dist/OpenDesigner-$version-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QMAKE: /usr/lib/qt6/bin/qmake6
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      # AppImages run without FUSE: the tools below are unpacked and run in place.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install Qt 6 and the AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config lld imagemagick file \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-multimedia-dev qt6-webengine-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtqml qml6-module-qtqml-workerscript qml6-module-qt-labs-folderlistmodel \
            qml6-module-qt-labs-platform qml6-module-qtcore qml6-module-qtmultimedia \
            qml6-module-qtwebengine libqt6svg6 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-alsa libgl1-mesa-dev libxkbcommon-dev libfontconfig1 fonts-dejavu-core
          mkdir -p "$HOME/tools"
          fetch() { # url sha256 file
            curl -fsSL -o "$HOME/tools/$3" "$1"
            echo "$2  $HOME/tools/$3" | sha256sum -c -
            chmod +x "$HOME/tools/$3"
          }
          fetch https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage \
            4648f278ab3ef31f819e67c30d50f462640e5365a77637d7e6f2ad9fd0b4522a linuxdeploy
          fetch https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage \
            15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724 linuxdeploy-plugin-qt
          fetch https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 appimagetool
          echo "$HOME/tools" >> "$GITHUB_PATH"
      - name: Package
        run: scripts/package-linux.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning qtmultimedia
          cache: true
      - name: Package
        shell: bash
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake.exe"
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          scripts/package-windows.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          First public build of OpenDesigner: a vector design canvas and video timeline that AI agents on your machine can drive. See the [README](https://github.com/skepjandi/opendesigner#readme) for what it does and [the wiki](https://github.com/skepjandi/opendesigner/wiki) for how it works.

          | System | Download | Notes |
          |--------|----------|-------|
          | macOS (Apple silicon) | `OpenDesigner-*-macos-arm64.zip` | Unzip and move `OpenDesigner.app` to Applications. Signed ad hoc, not notarized: on first open, right-click the app and choose Open (or run `xattr -dr com.apple.quarantine OpenDesigner.app`). |
          | Windows (x64) | `OpenDesigner-*-windows-x64.zip` | Unzip and run `opendesigner-app.exe`. Not code-signed: SmartScreen warns on first run (More info, then Run anyway). |
          | Linux (x86_64) | `OpenDesigner-*-linux-x86_64.AppImage` | `chmod +x` it and run it. Built on Ubuntu 24.04: needs glibc 2.39 or newer. Sound plays through the system's GStreamer: it needs `gstreamer1.0-plugins-base` and `-good` (installed on most desktops); without them the app crashed in our CI runner when the Video panel loaded. |

          Video export needs `ffmpeg` on your PATH. Verify a download against `SHA256SUMS.txt`.

          **This is an early build.** The macOS bundle was run by its builder; the Windows and Linux builds are checked only by an offscreen scripted session on the CI runner, not by hand on real desktops.

          OpenDesigner is MPL-2.0. It links Qt 6 dynamically under the LGPLv3; the Qt libraries ship next to the program and can be replaced. License notices are inside each download.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "OpenDesigner ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            *.zip *.AppImage SHA256SUMS.txt
