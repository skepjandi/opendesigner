[graph]
all-features = true

[advisories]
version = 2
# ttf-parser is marked unmaintained (no vulnerability). It is reached only through fontdb, which
# cosmic-text uses to read the bundled font and the machine's installed fonts; a project file or an
# agent can name a family but never supplies font bytes. Exit plan and evidence: roadmap decision log.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no vulnerability; fonts come from the app bundle and the user's machine only" },
]

[licenses]
version = 2
# Permissive licenses and MPL-2.0 only. No GPL/AGPL (AGENTS.md invariant 12).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
